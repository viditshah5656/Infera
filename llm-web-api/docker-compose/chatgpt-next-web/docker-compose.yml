services:
  chatgpt-next-web:
    image: yidadaa/chatgpt-next-web 
    ports:
      - "3000:3000" 
    environment: 
      # Compatibility value only; this is not an OpenAI API key.
      OPENAI_API_KEY: "anything"
      BASE_URL: "http://chatgpt:5000" 
      CUSTOM_MODELS: "-all,+gpt-3.5-turbo"                # 非登录用户，免费用户
      # CUSTOM_MODELS: "-all,+gpt-3.5-turbo,gpt-4,gpt4o"  # Plus用户
    depends_on:
      - chatgpt 
    restart: unless-stopped

  chatgpt:
    image: adryfish/llm-web-api
    container_name: llm-web-api-chatgpt-next-web
    ports:
      - "5000:5000"
    # volumes:
    #   # 浏览器数据，如何要保留浏览器登录信息，需要配置
    #   - ./browser_data:/app/browser_data
    environment:
      OPENAI_LOGIN_TYPE: "nologin"
    restart: unless-stopped