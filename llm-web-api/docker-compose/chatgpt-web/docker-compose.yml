services:
  chatgpt-web:
    image: chenzhaoyu94/chatgpt-web # always use latest, pull the tag image again to update
    container_name: chatgpt-web
    ports:
      - 3002:3002
    environment:
      # Compatibility value only; this is not an OpenAI API key.
      OPENAI_API_KEY: "anything"
      OPENAI_API_BASE_URL: "http://chatgpt:5000/v1"
      OPENAI_API_MODEL: "gpt-3.5-turbo"
    depends_on:
      - chatgpt 
    restart: unless-stopped

  chatgpt:
    image: adryfish/llm-web-api
    container_name: llm-web-api-chatgpt-web
    ports:
      - "5000:5000"
    # volumes:
    #   # 浏览器数据，如何要保留浏览器登录信息，需要配置
    #   - ./browser_data:/app/browser_data
    environment:
      OPENAI_LOGIN_TYPE: "nologin"
    restart: unless-stopped