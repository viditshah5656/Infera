# 构建 Docker 镜像并推送到 GitHub Container Registry (ghcr.io)
# 触发方式：
#   1. 代码推送到 master / main 分支
#   2. 在 GitHub Actions 页面手动触发 (workflow_dispatch)
name: Build and Push Docker Image to GHCR

on:
  push:
    branches: [master, main]
    # 只改文档时跳过构建
    paths-ignore:
      - 'README.md'
      - 'README_ZH.md'
      - '**.md'
  workflow_dispatch:

# 同一分支同时只跑一个构建，新推送会取消旧的
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：读取代码，写入包（GHCR 需要）
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（为多平台构建做准备）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 每次构建都会默认打上 latest 标签；同时根据分支/标签/SHA 附带其他标签，例如：
      #   ghcr.io/smanx/qwen2api:latest
      #   ghcr.io/smanx/qwen2api:master
      #   ghcr.io/smanx/qwen2api:sha-<7位sha>
      #   ghcr.io/smanx/qwen2api:<semver>    （推送 v1.2.3 之类标签时）
      # 说明：sha 标签带 sha- 前缀，让 latest 在 GitHub 包页面的
      # 标签排序中排最前，页面默认展示 latest 而不是哈希 tag。
      - name: 生成镜像元数据（标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          # 同时构建 amd64 和 arm64（QEMU + Buildx 已在上方配置）
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub Actions 缓存加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
