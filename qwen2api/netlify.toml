[build]
  command = "npm install"

# Netlify Functions（Node 运行时）- 取代原 Edge Functions 配置
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 同步函数超时上限：Pro/Enterprise 计划最大 26 秒，免费 Hobby 计划上限 10 秒。
# 上传附件（OSS PUT + 状态轮询）耗时较长，必须保留足够余量。
[[functions]]
  path = "api.js"
  timeout = 26

# 将 API 与页面路由重写到 Functions 入口
[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

# /chat 页面由函数提供（core.js 磁盘读取失败时会回退到打包进
# chat-html.js 的内联副本，因此函数环境也能正常返回页面）
[[redirects]]
  from = "/chat"
  to = "/.netlify/functions/api/chat"
  status = 200
  force = true

[[redirects]]
  from = "/chat/*"
  to = "/.netlify/functions/api/chat/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/api/"
  status = 200
  force = true
